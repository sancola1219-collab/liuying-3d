<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台南廠 製程導覽｜設計產能 2.5 萬噸／年</title>
<style>
:root{
  --bg:#f3f4f2; --panel:#fbfbf9; --ink:#1c2430; --ink2:#5a6472; --ink3:#8a929c; --line:#dfe2e0;
  --acc:#d9622b; --acc2:#f6e3d8;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  --pw:clamp(360px,30vw,560px); --bh:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--pw) 1fr;grid-template-rows:1fr var(--bh);grid-template-areas:"panel stage" "bar bar"}
#panel{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
#brand{display:flex;justify-content:space-between;align-items:center;padding:22px 34px 0;font-size:14px;letter-spacing:.18em;color:var(--ink3)}
#brand b{color:var(--ink);font-weight:700;letter-spacing:.12em}
#pin{flex:1;overflow:auto;padding:10px 34px 24px;scrollbar-width:thin}
#no{font-size:118px;line-height:1;font-weight:200;color:var(--acc);letter-spacing:-.02em;margin-top:18px;font-variant-numeric:tabular-nums}
#no small{font-size:20px;color:var(--ink3);font-weight:400;letter-spacing:.1em;margin-left:10px;vertical-align:top;position:relative;top:16px}
#ttl{font-size:46px;font-weight:800;margin:8px 0 4px;line-height:1.15;letter-spacing:.02em}
#sub{font-size:18px;color:var(--ink2);margin:0 0 18px;padding-left:12px;border-left:4px solid var(--acc)}
#desc{font-size:19px;line-height:1.75;color:#333b46;margin:0 0 20px}
#keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-bottom:18px}
.key{border-top:1px solid var(--line);padding:12px 0 8px}
.key .v{font-size:38px;font-weight:800;color:var(--acc);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.key .u{font-size:17px;font-weight:600;color:var(--ink2);margin-left:5px}
.key .l{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.35}
#legend{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--ink2)}
#legend span{display:inline-flex;align-items:center;gap:7px}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
#legend i.dot{border-radius:50%;width:12px;height:12px;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor}
#legend i.flow{width:16px;height:12px;border-radius:0;clip-path:polygon(0 25%,60% 25%,60% 0,100% 50%,60% 100%,60% 75%,0 75%)}
#legend i.role{width:12px;height:16px;border-radius:6px 6px 3px 3px;border-top:5px solid #fff}
#legend i.ghost{background:repeating-linear-gradient(45deg,#c9ced3 0 3px,transparent 3px 6px);border:1px solid #b9bfc5}
#fold{display:none}
#stage{grid-area:stage;position:relative;overflow:hidden;background:linear-gradient(#e9eef2,#f3f4f1);touch-action:none}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border:1px solid rgba(28,36,48,.14);border-left:4px solid var(--c,#d9622b);border-radius:3px;padding:5px 10px 6px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,40,.10);will-change:transform,opacity}
.tag b{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.25}
.tag s{display:block;text-decoration:none;font-size:14px;color:var(--ink2);line-height:1.25}
.tag.zone{border-left-width:0;border-radius:14px;padding:4px 12px;background:var(--c);border-color:transparent;color:#fff}
.tag.zone b{color:#fff;font-size:15px}
#subt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:86%;text-align:center;font-size:29px;line-height:1.45;color:#fff;background:rgba(24,30,38,.74);padding:8px 22px 10px;border-radius:6px;opacity:0;pointer-events:none;letter-spacing:.03em}
#ctrl{position:absolute;right:18px;top:16px;display:flex;gap:8px;align-items:center}
#ctrl button{border:1px solid rgba(28,36,48,.16);background:rgba(255,255,255,.92);color:var(--ink);font-size:15px;padding:8px 14px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hint{position:absolute;right:16px;bottom:12px;font-size:13px;color:var(--ink2);pointer-events:none;background:rgba(255,255,255,.82);padding:4px 10px;border-radius:12px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);background:rgba(243,244,242,.9)}
#bar{grid-area:bar;display:flex;align-items:stretch;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:1 0 auto;min-width:64px;border:0;border-right:1px solid #eef0ee;background:none;padding:8px 8px 10px;text-align:left;position:relative;color:var(--ink3)}
#bar button em{display:block;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#bar button span{display:block;font-size:14px;white-space:nowrap;margin-top:2px}
#bar button.on{color:var(--ink);background:#f6f7f5}
#bar button.on em{color:var(--c,#d9622b)}
#bar button i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--c,#d9622b)}
#bar button.done i{width:100%;opacity:.25}
body.rec #ctrl,body.rec #hint{display:none}
/* 手機直式：模型在上、資訊欄在下可收合 */
@media (max-width:820px) and (orientation:portrait){
  :root{--bh:58px}
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto var(--bh);grid-template-areas:"stage" "panel" "bar"}
  #panel{border-right:0;border-top:1px solid var(--line);max-height:46vh;transition:max-height .3s}
  #panel.folded{max-height:92px}
  /* 10/10 手機實看修正：模型區放大、標籤縮小、引線縮短、右上角不壓字 */
  #panel{max-height:34vh}#panel.folded{max-height:76px}
  #brand2{display:none}
  #no{font-size:36px}#ttl{font-size:22px}#desc{font-size:14px;line-height:1.55}
  .tag{padding:2px 6px 3px 6px;border-left-width:3px}.tag b{font-size:11px}.tag s{font-size:9.5px}
  .tag.zone{padding:2px 8px}.tag.zone b{font-size:11px}
  #ctrl{right:8px;top:8px;gap:5px}#ctrl button{font-size:12px;padding:5px 9px}
  #subt{font-size:14px;max-width:94%;padding:5px 12px 6px;bottom:8px}
  #brand{padding:10px 16px 0;font-size:12px}
  #pin{padding:4px 16px 14px}
  #no{font-size:44px;margin-top:2px;display:inline-block}
  #no small{font-size:13px;top:4px}
  #ttl{font-size:26px;display:inline-block;margin:0 0 0 10px;vertical-align:6px}
  #sub{font-size:14px;margin:6px 0 10px}
  #desc{font-size:15px;line-height:1.6}
  .key .v{font-size:26px}.key .u{font-size:14px}.key .l{font-size:13px}
  #fold{display:block;position:absolute;right:12px;top:8px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:13px;padding:4px 12px;color:var(--ink2)}
  #ctrl{right:10px;top:10px;gap:6px}#ctrl button{font-size:13px;padding:6px 10px}
  #hint{display:none}
  #subt{font-size:16px;bottom:10px}
  .tag b{font-size:13px}.tag s{font-size:11px}.tag{padding:3px 7px 4px 7px}
  #bar button{min-width:58px}#bar button span{font-size:12px}
}
@media (max-width:1100px) and (orientation:landscape){
  :root{--pw:clamp(260px,32vw,360px)}
  #no{font-size:64px}#ttl{font-size:30px}#desc{font-size:15px}.key .v{font-size:26px}
}
</style>

00 風管走平台下","box":[0.3,0.3,0.6],"win":[0.36,0.74]},{"p":[-30.0,4.6,-48.73],"t":"平台北側走道","s":"直通西梯 ST1／東梯 ST2","box":[0.3,0.3,0.6],"win":[0.64,0.89]},{"p":[-15.84,4.7,-45.07],"t":"吊裝口","s":"平時蓋格柵蓋板・可走","box":[0.3,0.3,0.6],"win":[0.74,0.89]},{"p":[-16.0,3.15,-50.6],"t":"鐵液緩存罐","s":"品管取樣量比重","box":[0.3,0.3,0.6],"win":[0.88,1.01]},{"p":[-30.08,5.35,-44.33],"t":"化鐵釜","s":"釜周開孔：環形格柵蓋板","box":[1.5,1.5,5.05],"win":[0.74,0.89]}],"legend":[["fill","#d9622b","本區範圍"],["dot","#d9622b","設備標註（引線）"],["flow","#2fbf5a","磷酸"],["flow","#a8501e","鐵液"],["flow","#ff5fa8","含氫排氣"],["role","#ff7a1a","操作員","#f4f4ee"],["role","#8cd13c","品管","#2f74d0"],["ghost","","擋住視線的屋頂、外牆暫時半透明"]],"lead":1.4,"aid":"c03","voice":66.96,"D":70.96,"subs":[[1.45,4.51,"化鐵車間是整條線的起點"],[4.51,8.07,"八台 60 立方米化鐵釜排成一列"],[8.07,9.75,"另外留兩個釜位"],[9.75,12.15,"磷酸和回收的母液打進釜裡"],[12.15,14.36,"每台釜配兩台石墨換熱器"],[14.36,18.79,"用 0.4 MPa 的蒸汽加熱到 85 度左右"],[18.79,20.83,"把鐵錠慢慢溶成亞鐵液"],[20.83,24.15,"一批大約 12 個小時，八台釜輪流"],[24.15,25.81,"一天做 16 批"],[25.81,27.62,"溶鐵會放出氫氣"],[27.62,31.47,"每台釜北側有一台引風機把它抽出來"],[31.47,35.09,"引風機的出口朝下吹，風管穿過平台"],[35.09,39.55,"在平台下面往北走，過了平台北緣再立管上去"],[39.55,42.1,"接進北牆內側的排氣總管"],[42.1,45.28,"送到北牆外兩座酸霧洗滌塔處理"],[45.28,49.89,"這樣平台北側就沒有風管擋路，留出一條走道"],[49.89,52.53,"從西邊樓梯直通東邊樓梯"],[52.53,56.45,"釜身周圍的開孔鋪了可拆的環形格柵蓋板"],[56.45,60.17,"鐵液板框的吊裝口平時也蓋著格柵蓋板"],[60.17,62.65,"人可以走，吊裝時才打開"],[62.65,65.72,"品管在緩存罐旁取樣量比重"],[65.72,68.31,"鐵液過濾後就送去合成"]],"text":"化鐵車間是整條線的起點。八台 60 立方米化鐵釜排成一列，另外留兩個釜位。磷酸和回收的母液打進釜裡，每台釜配兩台石墨換熱器，用 0.4 MPa 的蒸汽加熱到 85 度左右，把鐵錠慢慢溶成亞鐵液；一批大約 12 個小時，八台釜輪流，一天做 16 批。溶鐵會放出氫氣，每台釜北側有一台引風機把它抽出來。引風機的出口朝下吹，風管穿過平台，在平台下面往北走，過了平台北緣再立管上去，接進北牆內側的排氣總管，送到北牆外兩座酸霧洗滌塔處理。這樣平台北側就沒有風管擋路，留出一條走道，從西邊樓梯直通東邊樓梯。釜身周圍的開孔鋪了可拆的環形格柵蓋板；鐵液板框的吊裝口平時也蓋著格柵蓋板，人可以走，吊裝時才打開。品管在緩存罐旁取樣量比重，鐵液過濾後就送去合成。"},{"id":"c04","no":"04","short":"合成","title":"合成","sub":"生產車間中段　+4.0 m 平台","desc":"氧化釜加雙氧水、ORP 超過 800 mV 即氧化完成，磷酸鐵沉出成乳白漿料；陳化釜保溫讓晶體長好，混合釜混勻降溫後送板框。","keys":[["38","m³ ×4","氧化釜（有效 30）80±2 °C"],[">800","mV","ORP 氧化終點"],["63","m³ ×6","陳化釜 88±2 °C・2 h"],["100","m³ ×2","混合釜（有效 80）"]],"refs":[61,68,73,76],"color":"#d9622b","cam":{"c":[-21.0,5,-16.5],"R":40,"el":42,"T":40},"ghost":true,"ghostRect":[-43.0,-32.0,1.0,-1.0],"ghostSkip":[],"foot":{"r":[-37.0,-5.0,-26.0,-7.0],"y":4.0,"color":"#d9622b"},"callouts":[{"p":[-31.89,6.8,-16.38],"t":"氧化釜 R-301","s":"38 m³ ×4","box":[1.12,1.12,6.4]},{"p":[-29.65,8.05,-21.11],"t":"雙氧水高位罐","s":"4 m³ ×4","box":[0.75,0.75,1.75]},{"p":[-19.13,7.8,-16.59],"t":"陳化釜 R-302","s":"63 m³ ×6","box":[1.31,1.31,7.4]},{"p":[-10.14,11.8,-16.59],"t":"混合釜 R-303","s":"100 m³ ×2","box":[1.42,1.42,11.4]}],"legend":[["fill","#d9622b","本區範圍"],["dot","#d9622b","設備標註（引線）"],["flow","#19b6e6","雙氧水"],["flow","#a8501e","鐵液"],["flow","#f0c050","漿料"],["role","#8cd13c","品管","#2f74d0"],["role","#ff7a1a","操作員","#f4f4ee"],["ghost","","擋住視線的屋頂、外牆暫時半透明"]],"lead":1.4,"aid":"c04","voice":38.712,"D":42.71,"subs":[[1.5,4.4,"合成區在 4 公尺平台上"],[4.4,7.65,"鐵液和母液調好濃度，進四台氧化釜"],[7.65,9.75,"溫度控制在 80 度"],[9.75,12.61,"上方高位罐把雙氧水慢慢加進去"],[12.61,14.33,"大約 30 分鐘"],[14.33,18.33,"ORP 超過 800 毫伏，就是氧化完成"],[18.33,21.39,"磷酸鐵沉出來，變成乳白色的漿料"],[21.39,25.22,"接著進六台陳化釜，88 度保溫兩個小時"],[25.22,26.36,"讓晶體長好"],[26.36,29.81,"最後到兩台 100 立方米的混合釜"],[29.81,33.45,"有效容量 80，降溫到 60 度以下"],[33.45,34.4,"送去板框"],[34.4,36.71,"品管在氧化釜旁邊取樣"],[36.71,40.06,"看 ORP 和亞鐵有沒有反應完"]],"text":"合成區在 4 公尺平台上。鐵液和母液調好濃度，進四台氧化釜，溫度控制在 80 度，上方高位罐把雙氧水慢慢加進去，大約 30 分鐘；ORP 超過 800 毫伏，就是氧化完成，磷酸鐵沉出來，變成乳白色的漿料。接著進六台陳化釜，88 度保溫兩個小時，讓晶體長好；最後到兩台 100 立方米的混合釜，有效容量 80，降溫到 60 度以下，送去板框。品管在氧化釜旁邊取樣，看 ORP 和亞鐵有沒有反應完。"},{"id":"c05","no":"05","short":"板框洗滌","title":"板框洗滌","sub":"生產車間中段　+4.1 m 平台","desc":"四台 420 m² 隔膜板框壓濾，四段逆流洗到電導率 <50 µS/cm，再由水壓罐經壓榨水泵供水壓榨；濾餅落到皮帶送閃蒸。行車 C-401 在水壓罐上方設禁行區。七座緩存罐坐 +4.1 m 平台北側，泵在平台下排成一列、走道東端出口；母液、洗水打回儲罐區（罐上 +7.0 m 操作平台）回收。","keys":[["420","m² ×4","隔膜洗滌板框"],["1.08","t/h／台","單台處理量"],["<50","µS/cm","洗滌終點電導率"],["20","m³","水壓罐（壓榨 0.8–1.2 MPa）"]],"refs":[81,82,86,90],"color":"#d9622b","cam":{"c":[-15.0,4,6.75],"R":40,"el":42,"T":40,"moves":[{"c":[-5.5,7.0,1.0],"R":34,"el":30,"k0":0.46,"k1":0.52,"gg":0,"az":125},{"c":[-12.0,3.0,0.0],"R":34,"el" 6.18,48.51,"水壓罐上方設了禁行區"],[48.51,52.11,"用電子區域限位加凸輪限位雙重保護"],[52.11,54.01,"吊鉤不會經過罐頂"],[54.01,56.64,"平台北側坐著七座緩存罐"],[56.64,60.15,"兩座母液罐、四座洗水罐和水壓罐"],[60.15,64.97,"罐底的泵都在平台下方排成一列，泵前留有走道"],[64.97,66.29,"從東端出去"],[66.29,70.7,"濾出的母液從板框上方越過罐頂，進母液緩存罐"],[70.7,73.9,"再由平台下的母液泵往上打到管架"],[73.9,77.9,"送到北邊儲罐區的 80 立方米儲罐回收"],[77.9,81.71,"母液再送回化鐵和合成使用；洗水也一樣"],[81.71,84.51,"由平台下的洗水泵打回儲罐區"],[84.51,87.91,"儲罐上方有 7 公尺的操作平台"],[87.91,91.3,"罐頂閥件和液位計都在平台上操作"]],"text":"板框區是我們的心臟。四台 420 平方米的隔膜板框架在 4.1 公尺平台上，每台每小時處理大約 1.08 噸；平台西端還有第 3 台 200 型板框。漿料從平台上方接進板框尾板，壓成濾餅，接著四段逆流洗：最乾淨的純水洗最後一道，洗過的水往前一段再用，一路洗到電導率低於 50 微西門子。洗好以後，20 立方米的水壓罐經平台下的壓榨水泵供水，用 0.8 到 1.2 MPa 把濾餅壓榨到含水約 25%，打開板框，濾餅掉到下面的皮帶，送去閃蒸。板框上方的行車吊濾板時，水壓罐上方設了禁行區，用電子區域限位加凸輪限位雙重保護，吊鉤不會經過罐頂。平台北側坐著七座緩存罐：兩座母液罐、四座洗水罐和水壓罐，罐底的泵都在平台下方排成一列，泵前留有走道，從東端出去。濾出的母液從板框上方越過罐頂，進母液緩存罐，再由平台下的母液泵往上打到管架，送到北邊儲罐區的 80 立方米儲罐回收，母液再送回化鐵和合成使用；洗水也一樣，由平台下的洗水泵打回儲罐區。儲罐上方有 7 公尺的操作平台，罐頂閥件和液位計都在平台上操作。"},{"id":"c06","no":"06","short":"閃蒸乾燥","title":"閃蒸乾燥","sub":"生產車間中段","desc":"蒸汽翅片換熱器把空氣加熱到 200～230 °C，熱風把濕濾餅打散瞬間吹乾；乾粉經旋風、布袋收集進乾品緩存倉，氣力輸送到回轉窯。","keys":[["3,200","kg/h","濕料進料（XSG-18）"],["2,200","kg/h","乾品產出"],["25→1","%","含水率"],["200–230","°C","進風溫度（出風 100–105）"]],"refs":[105,106,107,108],"color":"#d9622b","cam":{"c":[-37.0,5,5.75],"R":38,"el":40,"T":38},"ghost":true,"ghostRect":[-51.5,-10.5,-22.5,22.0],"ghostSkip":[],"foot":{"r":[-45.5,-28.5,-4.5,16.0],"y":0.0,"color":"#d9622b"},"callouts":[{"p":[-40.42,10.6,7.03],"t":"閃蒸乾燥塔 FD-501","s":"XSG-18","box":[0.83,0.83,8.7]},{"p":[-33.6,3.25,10.68],"t":"翅片換熱器 E-501","s":"蒸汽 2,860 kg/h","box":[1.69,1.69,3.0]},{"p":[-33.3,9.752,5.94],"t":"旋風分離器","s":"CY-501","box":[0.98,0.98,7.95]},{"p":[-36.79,2.3,5.64],"t":"布袋除塵器","s":"636 m²","box":[0.83,0.83,1.4]},{"p":[-40.09,11.9,0.11],"t":"乾品緩存倉","s":"10 m³","box":[1.24,1.24,10.35]}],"legend":[["fill","#d9622b","本區範圍"],["dot","#d9622b","設備標註（引線）"],["flow","#8a6a4a","濾餅"],["flow","#ff8c2a","熱風"],["flow","#fff1b8","粉料"],["role","#ff7a1a","操作員","#f4f4ee"],["ghost","","擋住視線的屋頂、外牆暫時半透明"]],"lead":1.4,"aid":"c06","voice":36.768,"D":40.77,"subs":[[1.5,4.54,"濾餅從皮帶進閃蒸乾燥機"],[4.54,9.97,"蒸汽翅片換熱器先把空氣加熱到 200 到 230 度"],[9.97,13.19,"熱風把濕濾餅打散，一瞬間就吹乾"],[13.19,16.61,"含水從 25% 降到 1% 左右"],[16.61,19.17,"每小時進料 3,200 公斤"],[19.17,21.56,"出來 2,200 公斤乾粉"],[21.56,23.78,"出風溫度大約 100 度"],[23.78,26.71,"乾粉經過旋風和布袋收下來"],[26.71,30.78,"進鋼構上的乾品緩存倉，再用氣力輸送"],[30.78,32.14,"送到回轉窯"],[32.14,35.46,"操作員在動力櫃前看進出風溫度"],[35.46,38.12,"另一位沿著乾燥塔巡一圈"]],"text":"濾餅從皮帶進閃蒸乾燥機。蒸汽翅片換熱器先把空氣加熱到 200 到 230 度，熱風把濕濾餅打散，一瞬間就吹乾，含水從 25% 降到 1% 左右。每小時進料 3,200 公斤，出來 2,200 公斤乾粉，出風溫度大約 100 度。乾粉經過旋風和布袋收下來，進鋼構上的乾品緩存倉，再用氣力輸送，送到回轉窯。操作員在動力櫃前看進出風溫度，另一位沿著乾燥塔巡一圈。"},{"id":"c07","no":"07","short":"回轉窯","title":"回轉窯煅燒","sub":"生產車間西段","desc":"兩條電熱回轉窯（窯架 +3.4 m）把二水磷酸鐵的結晶水燒掉，出窯就是無水磷酸鐵；第三條窯的位置、電力與冷卻水已經預留。","keys":[["2＋1","條","電熱回轉窯（第 3 條預留）"],["1,100","kW／條","電熱功率"],["3","h","窯內停留"]],"refs":[117,119,122],"color":"#d9622b","cam":{"c":[-58.25,3,4.0],"R":46,"el":46,"T":40},"ghost":true,"ghostRect":[-79.0,-12.0,-37.5,20.0],"ghostSkip":[],"foot":{"r":[-73.0,-43.5,-6.0,14.0],"y":0.0,"color":"#d9622b"},"callouts":[{"p":[-60.9,9.175,-1.27],"t":"回轉窯 K-601A","s":"1,100 kW","box":[1.46,1.46,8.88]},{"p":[-60.9,7.05,9.51],"t":"回轉窯 K-601B","s":"1,100 kW","box":[1.42,1.42,6.75]},{"p":[-48.41,2.888,2.64],"t":"窯尾袋濾","s":"×2","box":[0.9,0.9,0.3]},{"p":[-77.5,2.5,12.45],"t":"SCR 電熱盤","s":"每窯 1 組","box":[0.38,0.38,2.1]}],"legend":[["fill","#d9622b","本區範圍"],["dot","#d9622b","設備標註（引線）"],["role","#ff7a1a","操作員","#f4f4ee"],["ghost","","擋住視線的屋頂、外牆暫時半透明"]],"lead":1.4,"aid":"c07","voice":30.672,"D":34.67,"subs":[[1.45,6.3,"下一站是回轉窯，把二水磷酸鐵的結晶水燒掉"],[6.3,8.3,"我們有兩條電熱回轉窯"],[8.3,11.38,"架在 3.4 公尺高的鋼構窯架上"],[11.38,13.92,"每條電熱 1,100 千瓦"],[13.92,16.27,"爐膛設計溫度 800 度"],[16.27,20.26,"粉在窯裡轉大約三個小時，出窯就是無水磷酸鐵"],[20.26,25.04,"第三條窯的位置、電力和冷卻水也都預留好了"],[25.04,29.06,"操作員在 SCR 電熱盤前看八個溫區"],[29.06,32.02,"巡檢員沿著兩條窯中間走一圈"]],"text":"下一站是回轉窯，把二水磷酸鐵的結晶水燒掉。我們有兩條電熱回轉窯，架在 3.4 公尺高的鋼構窯架上，每條電熱 1,100 千瓦，爐膛設計溫度 800 度；粉在窯裡轉大約三個小時，出窯就是無水磷酸鐵。第三條窯的位置、電力和冷卻水也都預留好了。操作員在 SCR 電熱盤前看八個溫區，巡檢員沿著兩條窯中間走一圈。"},{"id":"c08","no":"08","short":"粉碎除磁",
