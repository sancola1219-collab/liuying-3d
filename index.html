<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>台南廠 3D 寫實檢視</title>
<style>
  :root { --bg:#dfe8ee; --panel:#ffffffe8; --ink:#1d2430; --muted:#5b6575; --line:#d3d9e0; --accent:#c8501e; --hover:#f3f5f8; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; }
  #ui { position:fixed; left:12px; top:12px; width:286px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; box-shadow:0 2px 12px #0003; backdrop-filter:blur(6px); }
  #ui h1 { font-size:15px; margin:0 0 2px; } #ui .sub { color:var(--muted); font-size:11px; margin-bottom:6px; line-height:1.4; }
  #ui h2 { font-size:12px; margin:10px 0 4px; color:var(--muted); font-weight:600; display:flex; justify-content:space-between; align-items:baseline; }
  #ui h2 small { font-weight:400; font-size:11px; }
  .btns { display:flex; flex-wrap:wrap; gap:4px; }
  button { font:inherit; font-size:12px; padding:3px 7px; border:1px solid var(--line); background:#fff; border-radius:5px; cursor:pointer; color:var(--ink); }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  label.l { display:flex; align-items:center; gap:6px; margin:2px 0; cursor:pointer; }
  .sw { width:11px; height:11px; border-radius:2px; border:1px solid #0003; flex:none; }
  .row { display:flex; align-items:center; gap:5px; padding:1px 2px; border-radius:4px; }
  .row:hover { background:var(--hover); }
  .row .nm { flex:1; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .ct { color:var(--muted); font-size:11px; }
  .row input { margin:0; }
  .cr { width:16px; height:16px; padding:0; border:none; background:none; font-size:10px; color:var(--muted); line-height:16px; flex:none; }
  .cr:hover { color:var(--accent); }
  .g > .row { font-weight:600; }
  .kids { margin-left:16px; }
  .kids[hidden] { display:none; }
  .lab { font-size:11px; color:#111; background:#fffc; padding:1px 4px; border-radius:3px; border:1px solid #0002; white-space:nowrap; pointer-events:none; }
  .lab.e { color:#8a2b00; font-size:10px; }
  .lab.p { color:#0b3d91; font-size:10px; background:#eef4ffd0; }
  #tip { position:fixed; right:12px; bottom:12px; font-size:11px; color:var(--muted); background:var(--panel); padding:4px 8px; border-radius:5px; }
  #load { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 22px; font-size:14px; box-shadow:0 2px 12px #0003; }
  #load[hidden] { display:none; }
  #ui .hd { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #ui .hd h1 { margin:0; }
  #uitog { flex:none; font-size:12px; padding:2px 8px; }
  #ui.closed { width:auto; max-height:none; overflow:visible; padding:6px 8px 6px 12px; }
  #ui.closed #uibody { display:none; }
  #pf { border:1px solid var(--line); border-radius:6px; padding:4px 6px 6px; margin:6px 0 4px; background:#fafbfc; }
  #pf h2 { margin-top:2px; }
  #pflist { max-height:290px; overflow:auto; margin-top:3px; }
  #pf .row .only { font-size:10px; padding:0 4px; line-height:15px; flex:none; }
  #pf .row .ct { white-space:nowrap; }
  #pfx { border-top:1px solid var(--line); margin-top:4px; padding-top:3px; }
  @media (max-width:600px){ #ui.closed{ right:auto; } #pflist{ max-height:28vh; } }
  @media (max-width:600px){ #ui{ width:auto; right:12px; max-height:45%; } #tip{ display:none; } }
</style>
</head>

<div id="c"></div>
<div id="ui">
  <div class="hd"><h1>台南廠 3D 規劃模型</h1><button id="uitog" type="button" aria-expanded="true">收合 ▴</button></div>
  <div id="uibody">
  <div id="pf">
  <h2>管路篩選 <small>勾選要看的管路</small></h2>
  <div class="btns"><button id="pfall" type="button">全選</button><button id="pfnone" type="button">全不選</button><button id="pfinv" type="button">反選</button></div>
  <label class="l"><input type="checkbox" id="pffade">其他淡化（沒選到的管路、設備、建物半透明）</label>
  <div id="pflist"></div>
  <div id="pfx"></div>
  </div>
  <div class="sub">管路版 20261019｜架台細部＋鋼製基座｜管架依製造圖｜車道淨空</div>
  <h2>全廠區</h2>
  <label class="l"><input type="checkbox" id="sw_out" checked>承租範圍外（房東 6000 坪）</label>
  <label class="l"><input type="checkbox" id="sw_road" checked>道路地坪（鋪面、草地、停車格）</label>
  <label class="l"><input type="checkbox" id="sw_lease" checked>承租範圍界線＋排除區（返還房東）</label>
  <label class="l"><input type="checkbox" id="sw_guard" checked>警衛室區（警衛室、機車棚、大門）</label>
  <label class="l"><input type="checkbox" id="sw_ww" checked>廢水池區（WE1／WE2、廢棄物收集用地）</label>
  <label class="l"><input type="checkbox" id="sw_lbl" checked>全廠區標籤</label>
  <h2>分區 <small>鏡頭飛到該區，可旋轉拉近</small></h2>
  <div class="btns" id="areas"></div>
  <label class="l" style="display:none"><input type="checkbox" id="aclip">只顯示該區（切掉其他）</label>
  <h2>視角</h2>
  <div class="btns" id="views"></div>
  <h2>一鍵顯示</h2>
  <div class="btns" id="presets"></div>
  <h2>顯示</h2>
  <label class="l"><input type="checkbox" id="lbl" checked>設備標籤</label>
  <label class="l"><input type="checkbox" id="lble">電力盤號</label>
  <label class="l"><input type="checkbox" id="lblp">管線編號／管架</label>
  <label class="l"><input type="checkbox" id="shd" checked>太陽陰影</label>
  <label class="l"><input type="checkbox" id="ao" checked>環境遮蔽（立體感，較吃效能）</label>
  <label class="l"><input type="checkbox" id="edg">設備邊線</label>
  <label class="l"><input type="checkbox" id="wt">牆半透明（看室內）</label>
  <h2>群組／圖層 <small>點 ▸ 展開單層</small></h2>
  <div id="tree"></div>
  </div>
</div>
<div id="load">模型載入中…</div>
<div id="inapp" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#b45309;color:#fff;padding:8px 12px;font-size:14px;text-align:center">LINE／FB 內建瀏覽器可能開不動 3D，請點右上角「…」→「用預設瀏覽器開啟」（Chrome／Safari）</div>
