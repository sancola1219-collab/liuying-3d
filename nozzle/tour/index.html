<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>四流體噴頭運作導覽｜從液體到粉體</title>
<style>
:root{
  --bg:#f3f4f2; --panel:#fbfbf9; --ink:#1c2430; --ink2:#5a6472; --ink3:#8a929c; --line:#dfe2e0;
  --acc:#d9622b; --acc2:#f6e3d8;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  --pw:clamp(360px,30vw,560px); --bh:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--pw) 1fr;grid-template-rows:1fr var(--bh);grid-template-areas:"panel stage" "bar bar"}
#panel{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
#brand{display:flex;justify-content:space-between;align-items:center;padding:22px 34px 0;font-size:14px;letter-spacing:.18em;color:var(--ink3);gap:10px}
#brand b{color:var(--ink);font-weight:700;letter-spacing:.12em}
#brand a{color:var(--ink2);letter-spacing:.04em;text-decoration:none;border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:13px;white-space:nowrap}
#pin{flex:1;overflow:auto;padding:10px 34px 24px;scrollbar-width:thin}
#no{font-size:118px;line-height:1;font-weight:200;color:var(--acc);letter-spacing:-.02em;margin-top:18px;font-variant-numeric:tabular-nums}
#no small{font-size:20px;color:var(--ink3);font-weight:400;letter-spacing:.1em;margin-left:10px;vertical-align:top;position:relative;top:16px}
#ttl{font-size:46px;font-weight:800;margin:8px 0 4px;line-height:1.15;letter-spacing:.02em}
#sub{font-size:18px;color:var(--ink2);margin:0 0 18px;padding-left:12px;border-left:4px solid var(--acc)}
#desc{font-size:19px;line-height:1.75;color:#333b46;margin:0 0 20px}
#keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-bottom:18px}
.key{border-top:1px solid var(--line);padding:12px 0 8px}
.key .v{font-size:38px;font-weight:800;color:var(--acc);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.key .u{font-size:17px;font-weight:600;color:var(--ink2);margin-left:5px}
.key .l{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.35}
#legend{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--ink2)}
#legend:empty{display:none}
#legend span{display:inline-flex;align-items:center;gap:7px}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
#fold{display:none}
#stage{grid-area:stage;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 40%,#f9faf9 0%,#e9eef2 70%,#e2e7eb 100%);touch-action:none}
#gl{position:absolute;inset:0;transition:opacity .35s}
#gl canvas{display:block;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border:1px solid rgba(28,36,48,.14);border-left:4px solid var(--c,#d9622b);border-radius:3px;padding:5px 10px 6px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,40,.10);transition:opacity .3s}
.tag b{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.25}
.tag s{display:block;text-decoration:none;font-size:14px;color:var(--ink2);line-height:1.25}
#subt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:86%;text-align:center;font-size:29px;line-height:1.45;color:#fff;background:rgba(24,30,38,.74);padding:8px 22px 10px;border-radius:6px;opacity:0;pointer-events:none;letter-spacing:.03em;transition:opacity .2s}
#ctrl{position:absolute;right:18px;top:16px;display:flex;gap:8px;align-items:center}
#ctrl button{border:1px solid rgba(28,36,48,.16);background:rgba(255,255,255,.92);color:var(--ink);font-size:15px;padding:8px 14px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hint{position:absolute;right:16px;bottom:12px;font-size:13px;color:var(--ink2);pointer-events:none;background:rgba(255,255,255,.82);padding:4px 10px;border-radius:12px}
#chart{position:absolute;left:20px;top:18px;width:360px;background:rgba(255,255,255,.93);border:1px solid rgba(28,36,48,.12);border-radius:10px;padding:10px 12px 8px;display:none;box-shadow:0 2px 10px rgba(20,30,40,.08)}
#chart.on{display:block}
#chart h4{margin:0 0 4px;font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:.06em}
#chart svg{width:100%;height:auto;display:block}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(243,244,242,.35);z-index:5}
#start button{font-size:24px;font-weight:700;background:var(--acc);color:#fff;border:0;border-radius:40px;padding:16px 34px;box-shadow:0 6px 24px rgba(217,98,43,.35)}
#start small{display:block;font-size:14px;font-weight:400;opacity:.9;margin-top:4px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);background:rgba(243,244,242,.9);z-index:6}
#bar{grid-area:bar;display:flex;align-items:stretch;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:1 0 auto;min-width:64px;border:0;border-right:1px solid #eef0ee;background:none;padding:8px 8px 10px;text-align:left;position:relative;color:var(--ink3)}
#bar button em{display:block;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#bar button span{display:block;font-size:14px;white-space:nowrap;margin-top:2px}
#bar button.on{color:var(--ink);background:#f6f7f5}
#bar button.on em{color:var(--c,#d9622b)}
#bar button i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--c,#d9622b)}
#bar button.done i{width:100%;opacity:.25}
@media (max-width:820px) and (orientation:portrait){
  :root{--bh:58px}
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto var(--bh);grid-template-areas:"stage" "panel" "bar"}
  #panel{border-right:0;border-top:1px solid var(--line);max-height:34vh;transition:max-height .3s}
  #panel.folded{max-height:76px}
  #brand{padding:10px 16px 0;font-size:12px}
  #pin{padding:4px 16px 14px}
  #no{font-size:44px;margin-top:2px;display:inline-block}
  #no small{font-size:13px;top:4px}
  #ttl{font-size:26px;display:inline-block;margin:0 0 0 10px;vertical-align:6px}
  #sub{font-size:14px;margin:6px 0 10px}
  #desc{font-size:15px;line-height:1.6}
  .key .v{font-size:26px}.key .u{font-size:14px}.key .l{font-size:13px}
  #fold{display:block;position:absolute;right:12px;top:34px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:13px;padding:4px 12px;color:var(--ink2);z-index:2}
  .tag{padding:2px 6px 3px 6px;border-left-width:3px}.tag b{font-size:12px}.tag s{font-size:10px}
  #ctrl{right:8px;top:8px;gap:5px}#ctrl button{font-size:12px;padding:5px 9px}
  #subt{font-size:15px;max-width:94%;padding:5px 12px 6px;bottom:8px}
  #chart{width:220px;left:8px;top:48px;padding:6px 8px}#chart h4{font-size:11px}
  #hint{display:none}
  #bar button{min-width:58px}#bar button span{font-size:12px}
}
@media (max-width:1100px) and (orientation:landscape){
  :root{--pw:clamp(260px,32vw,360px)}
  #no{font-size:64px}#ttl{font-size:30px}#desc{font-size:15px}.key .v{font-size:26px}
  #subt{font-size:20px}
}
</style>

</head>

function lineMat(c = 0x8d99a6, o = 0.55) { return new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: o }); }

function latheShell(profile, mat, lines = true, x = 0, z = 0) {
  const g = new THREE.Group();
  const pts = profile.map(p => new THREE.Vector2(p[0], p[1]));
  const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 96), mat); g.add(m);
  if (lines) {

    for (const p of pts) { if (p.x < 1) continue; for (let k = 0; k < 96; k++) { const a = k / 96 * Math.PI * 2, b = (k + 1) / 96 * Math.PI * 2; seg.push(p.x * Math.sin(a), p.y, p.x * Math.cos(a), p.x * Math.sin(b), p.y, p.x * Math.cos(b)); } }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.Float32BufferAttribute(seg, 3));
    g.add(new THREE.LineSegments(lg, lineMat()));
  }
  g.position.set(x, 0, z);
  return g;
}
function tube(points, r, mat) {
  const path = new THREE.CurvePath();
  for (let i = 0; i < points.length - 1; i++) path.add(new THREE.LineCurve3(new THREE.Vector3(...points[i]), new THREE.Vector3(...points[i + 1])));
  return new THREE.Mesh(new THREE.TubeGeometry(path, points.length * 24, r, 20, false), mat);
}
// 沿折線移動的粒子
function polyFlow(pts, n, speed, color, size, jitter, alpha = 0.7) {
  const v = pts.map(p => new THREE.Vector3(...p)); const cum = [0];
  for (let i = 1; i < v.length; i++) cum.push(cum[i - 1] + v[i].distanceTo(v[i - 1]));
  const L = cum[cum.length - 1];
  const pm = pointsMaterial(); const obj = makePoints(n, pm);
  const s = new Float32Array(n).map(() => Math.random()), off = new Float32Array(n * 3).map(() => (Math.random() - 0.5) * 2 * jitter);
  const col = new THREE.Color(color);
  const a = obj.geometry.attributes;
  for (let i = 0; i < n; i++) { a.aColor.array.set([col.r, col.g, col.b], i * 3); a.aSize.array[i] = size * (0.7 + Math.random() * 0.6); }
  const tmp = new THREE.Vector3();
  return { obj, mat: pm, update(dt) {
    for (let i = 0; i < n; i++) {
      s[i] = (s[i] + speed * dt / L) % 1; const d = s[i] * L;
      let k = 1; while (k < cum.length - 1 && cum[k] < d) k++;
      tmp.lerpVectors(v[k - 1], v[k], (d - cum[k - 1]) / (cum[k] - cum[k - 1] || 1));
      a.position.array[i * 3] = tmp.x + off[i * 3]; a.position.array[i * 3 + 1] = tmp.y + off[i * 3 + 1]; a.position.array[i * 3 + 2] = tmp.z + off[i * 3 + 2];
      a.aAlpha.array[i] = alpha * Math.min(1, s[i] * 20) * Math.min(1, (1 - s[i]) * 20);
    }
    a.position.needsUpdate = a.aAlpha.needsUpdate = true;
  } };
}

  g.add(tube(duct, 200, glass(0xcfd8e0, 0.35)));
  g.add(latheShell([[110, -4750], [460, -3500], [460, -2150], [180, -2150]], glass(0xdde5ec, 0.25), true, cx, 0));
  const bin = new THREE.Mesh(new THREE.CylinderGeometry(380, 380, 520, 32), steel()); bin.position.set(cx, -5100, 0); g.add(bin);
  g.add(tube([[cx, -4750, 0], [cx, -4840, 0]], 90, steel()));

  const bag = new THREE.Mesh(new THREE.BoxGeometry(1500, 2300, 1500), glass(0xdde5ec, 0.22)); bag.position.set(bx, -2500, 0); g.add(bag);
  g.add(new THREE.LineSegments(new THREE.EdgesGeometry(bag.geometry), lineMat()).translateX(bx).translateY(-2500));
  for (let i = 0; i < 9; i++) { const b = new THREE.Mesh(new THREE.CylinderGeometry(110, 110, 1700, 16), new THREE.MeshStandardMaterial({ color: 0xe9e4d8, roughness: 0.9 })); b.position.set(bx - 450 + (i % 3) * 450, -2450, -450 + Math.floor(i / 3) * 450); g.add(b); }
  const hop = new THREE.Mesh(new THREE.ConeGeometry(1060, 900, 4, 1, true), glass(0xdde5ec, 0.25)); hop.rotation.y = Math.PI / 4; hop.rotation.x = Math.PI; hop.position.set(bx, -4100, 0); g.add(hop);
  const fx = 7600;
  g.add(tube([[bx + 750, -1700, 0], [fx, -1700, 0], [fx, -4300, 0]], 160, steel()));
  const fan = new THREE.Mesh(new THREE.CylinderGeometry(520, 520, 380, 32), steel()); fan.rotation.x = Math.PI / 2; fan.position.set(fx, -4600, 0); g.add(fan);
  g.add(tube([[fx + 400, -4600, 0], [8600, -4600, 0], [8600, 1600, 0]], 230, steel()));
  // 地面
  const grid = new THREE.GridHelper(26000, 52, 0xc6ccd2, 0xdde1e4); grid.position.set(2200, -5560, 0); g.add(grid);

  // 粒子：熱風
  const flows = [];
  const hotAir = polyFlow([[-3000, 260, 0], [-700, 260, 0], [0, 260, 0]], 120, 1600, '#e2552b', 70, 140, 0.5);
  g.add(hotAir.obj); flows.push(hotAir);
  const feed = polyFlow(feedPts, 140, 900, '#e0702a', 50, 20, 0.85); g.add(feed.obj); flows.push(feed);
  const exhaust = polyFlow([[cx, -2150, 0], [cx, -1100, 0], [bx, -1100, 0], [bx, -1500, 0], [bx, -1700, 0], [fx, -1700, 0], [fx, -4600, 0], [8600, -4600, 0], [8600, 1700, 0]], 260, 2200, '#9aa3ab', 60, 110, 0.35);
  g.add(exhaust.obj); flows.push(exhaust);
  // 塔內熱風（往下、逐漸降溫）
  const NA = 700, aMat = pointsMaterial(), air = makePoints(NA, aMat); g.add(air);
  const aS = new Float32Array(NA).map(() => Math.random()), aR = new Float32Array(NA).map(() => Math.random()), aA = new Float32Array(NA).map(() => Math.random() * Math.PI * 2);
  const hotC = new THREE.Color('#e2552b'), coolC = new THREE.Color('#b9a99c');
  // 霧滴 → 粉體
  const NP = 1700, pMat = pointsMaterial(), pw = makePoints(NP, pMat); g.add(pw);
  const pU = new Float32Array(NP).map(() => Math.random()), pR = new Float32Array(NP).map(() => 0.35 + Math.random() * 0.6), pA = new Float32Array(NP).map(() => Math.random() * Math.PI * 2), pY = new Float32Array(NP).map(() => Math.random());
  const dropC = new THREE.Color('#3f7fb8'), powC = new THREE.Color('#50545a'), c = new THREE.Color();
  const lerp = (a, b, t) => a + (b - a) * t, cl = t => Math.max(0, Math.min(1, t));

    if (u < 0.6) { const t = (u - 0.07) / 0.53; const a = a0 + t * 0.8; return out.set(R0 * Math.sin(a), lerp(-700 - pY[i] * 300, -H, t), R0 * Math.cos(a)); }
    if (u < 0.74) { const t = (u - 0.6) / 0.14; const a = a0 + 0.8 + t * 0.6; const y = lerp(-H, CB, t); const rr = R0 / R * lerp(R, 200, t) * 0.85; return out.set(rr * Math.sin(a), y, rr * Math.cos(a)); }
    if (u < 0.84) { // 出口管
      const t = (u - 0.74) / 0.10, segs = duct; const L = [0]; for (let k = 1; k < segs.length; k++) L.push(L[k - 1] + Math.hypot(segs[k][0] - segs[k - 1][0], segs[k][1] - segs[k - 1][1]));
      const d = t * L[L.length - 1]; let k = 1; while (k < L.length - 1 && L[k] < d) k++; const f = (d - L[k - 1]) / (L[k] - L[k - 1]);
      return out.set(lerp(segs[k - 1][0], segs[k][0], f) + Math.cos(a0) * 90, lerp(segs[k - 1][1], segs[k][1], f) + Math.sin(a0) * 90, Math.sin(a0 * 3) * 90);

    const t = (u - 0.84) / 0.16; const a = a0 + t * 22; const y = lerp(-2450, -4800, t); const rr = y > -3500 ? 420 : lerp(420, 100, (-3500 - y) / 1250);

      const u = aS[i]; let y, r;

    feed: { p: [-3200, -3800, -1200], t: '漿料槽＋進料泵', s: '把漿料送上塔頂', c: '#e0702a' },

  // 進度＋自動換章
  const bt = document.querySelector('#bar button.on i'); if (bt) bt.style.width = Math.min(100, tc / ch.D * 100) + '%';
  if (playing && tc >= ch.D) { if (ci < CH.length - 1) goto(ci + 1); else setPlaying(false); }
  // 鏡頭
  if (tween) {
    tween.t += dt; const k = ease(Math.min(1, tween.t / tween.dur));
    camera.position.lerpVectors(tween.p0, tween.p1, k); controls.target.lerpVectors(tween.t0, tween.t1, k);
    if (tween.t >= tween.dur) { tween = null; if (ch.cam2 && !ch._c2) { ch._c2 = 1; camTo(ch.cam2, Math.max(4, ch.D * 0.55)); } }
  } else if (ch.cam2 && !ch._c2 && tc > 0.5) { ch._c2 = 1; camTo(ch.cam2, Math.max(4, ch.D * 0.55)); }
  if (expAnim) { expAnim.t += dt / 1.6; N.set({ explode: expAnim.from + (expAnim.to - expAnim.from) * ease(Math.min(1, expAnim.t)) }); if (expAnim.t >= 1) expAnim = null; }
  controls.update();
  // 場景更新
  if (ch.scene === 'nozzle') N.update(dt, ch.n?.filter);
  if (ch.scene === 'dryer') { for (const m of D.mats) m.uniforms.uScale.value = uS * (ch.pk || 1); D.update(dt); D.N2.update(dt); }
  if (ch.scene === 'drop') {
    const [p0, p1] = ch.drop; const k = Math.max(0, Math.min(1, (tc - 0.4) / Math.max(3, ch.D - 1.5)));
    P.st.p = p0 + (p1 - p0) * (started ? k : 0.35); P.update(dt); chartMark(P.st.p);
  }
  renderer.render(scene, camera);
  tagAlpha = fading ? 0 : Math.min(1, Math.max(0, (tc - 1.6) / 0.6));
  layoutTags(stage.clientWidth, stage.clientHeight);
}

await loadNarration();
resize();
goto(0);
$('load').remove();
requestAnimationFrame(loop);
</script>
</body>
