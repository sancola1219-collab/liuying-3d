<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台南廠 人員動線導覽｜設計產能 25,000 噸／年</title>
<style>
:root{
  --bg:#f3f4f2; --panel:#fbfbf9; --ink:#1c2430; --ink2:#5a6472; --ink3:#8a929c; --line:#dfe2e0;
  --acc:#d9622b; --acc2:#f6e3d8;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  --pw:clamp(360px,30vw,560px); --bh:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--pw) 1fr;grid-template-rows:1fr var(--bh);grid-template-areas:"panel stage" "bar bar"}
#panel{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
#brand{display:flex;justify-content:space-between;align-items:center;padding:22px 34px 0;font-size:14px;letter-spacing:.18em;color:var(--ink3)}
#brand b{color:var(--ink);font-weight:700;letter-spacing:.12em}
#pin{flex:1;overflow:auto;padding:10px 34px 24px;scrollbar-width:thin}
#no{font-size:118px;line-height:1;font-weight:200;color:var(--acc);letter-spacing:-.02em;margin-top:18px;font-variant-numeric:tabular-nums}
#no small{font-size:20px;color:var(--ink3);font-weight:400;letter-spacing:.1em;margin-left:10px;vertical-align:top;position:relative;top:16px}
#ttl{font-size:46px;font-weight:800;margin:8px 0 4px;line-height:1.15;letter-spacing:.02em}
#sub{font-size:18px;color:var(--ink2);margin:0 0 18px;padding-left:12px;border-left:4px solid var(--acc)}
#desc{font-size:19px;line-height:1.75;color:#333b46;margin:0 0 20px;white-space:pre-line}
#keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-bottom:18px}
.key{border-top:1px solid var(--line);padding:12px 0 8px}
.key .v{font-size:38px;font-weight:800;color:var(--acc);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.key .u{font-size:17px;font-weight:600;color:var(--ink2);margin-left:5px}
.key .l{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.35}
#legend{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--ink2)}
#legend span{display:inline-flex;align-items:center;gap:7px}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
#legend i.dot{border-radius:50%;width:12px;height:12px;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor}
#legend i.flow{width:16px;height:12px;border-radius:0;clip-path:polygon(0 25%,60% 25%,60% 0,100% 50%,60% 100%,60% 75%,0 75%)}
#legend i.role{width:12px;height:16px;border-radius:6px 6px 3px 3px;border-top:5px solid #fff}
#legend i.ghost{background:repeating-linear-gradient(45deg,#c9ced3 0 3px,transparent 3px 6px);border:1px solid #b9bfc5}
#fold{display:none}
#stage{grid-area:stage;position:relative;overflow:hidden;background:linear-gradient(#e9eef2,#f3f4f1);touch-action:none}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border:1px solid rgba(28,36,48,.14);border-left:4px solid var(--c,#d9622b);border-radius:3px;padding:5px 10px 6px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,40,.10);will-change:transform,opacity}
.tag b{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.25}
.tag s{display:block;text-decoration:none;font-size:14px;color:var(--ink2);line-height:1.25}
.tag.zone{border-left-width:0;border-radius:14px;padding:4px 12px;background:var(--c);border-color:transparent;color:#fff}
.tag.zone b{color:#fff;font-size:15px}
#subt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:86%;text-align:center;font-size:29px;line-height:1.45;color:#fff;background:rgba(24,30,38,.74);padding:8px 22px 10px;border-radius:6px;opacity:0;pointer-events:none;letter-spacing:.03em}
#ctrl{position:absolute;right:18px;top:16px;display:flex;gap:8px;align-items:center}
#ctrl button{border:1px solid rgba(28,36,48,.16);background:rgba(255,255,255,.92);color:var(--ink);font-size:15px;padding:8px 14px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hint{position:absolute;right:16px;bottom:12px;font-size:13px;color:var(--ink2);pointer-events:none;background:rgba(255,255,255,.82);padding:4px 10px;border-radius:12px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);background:rgba(243,244,242,.9)}
#bar{grid-area:bar;display:flex;align-items:stretch;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:1 0 auto;min-width:64px;border:0;border-right:1px solid #eef0ee;background:none;padding:8px 8px 10px;text-align:left;position:relative;color:var(--ink3)}
#bar button em{display:block;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#bar button span{display:block;font-size:14px;white-space:nowrap;margin-top:2px}
#bar button.on{color:var(--ink);background:#f6f7f5}
#bar button.on em{color:var(--c,#d9622b)}
#bar button i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--c,#d9622b)}
#bar button.done i{width:100%;opacity:.25}
body.rec #ctrl,body.rec #hint{display:none}
/* 手機直式：模型在上、資訊欄在下可收合 */
@media (max-width:820px) and (orientation:portrait){
  :root{--bh:58px}
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto var(--bh);grid-template-areas:"stage" "panel" "bar"}
  #panel{border-right:0;border-top:1px solid var(--line);max-height:46vh;transition:max-height .3s}
  #panel.folded{max-height:92px}
  /* 10/10 手機實看修正：模型區放大、標籤縮小、引線縮短、右上角不壓字 */
  #panel{max-height:34vh}#panel.folded{max-height:76px}
  #brand2{display:none}
  #no{font-size:36px}#ttl{font-size:22px}#desc{font-size:14px;line-height:1.55}
  .tag{padding:2px 6px 3px 6px;border-left-width:3px}.tag b{font-size:11px}.tag s{font-size:9.5px}
  .tag.zone{padding:2px 8px}.tag.zone b{font-size:11px}
  #ctrl{right:8px;top:8px;gap:5px}#ctrl button{font-size:12px;padding:5px 9px}
  #subt{font-size:14px;max-width:94%;padding:5px 12px 6px;bottom:8px}
  #brand{padding:10px 16px 0;font-size:12px}
  #pin{padding:4px 16px 14px}
  #no{font-size:44px;margin-top:2px;display:inline-block}
  #no small{font-size:13px;top:4px}
  #ttl{font-size:26px;display:inline-block;margin:0 0 0 10px;vertical-align:6px}
  #sub{font-size:14px;margin:6px 0 10px}
  #desc{font-size:15px;line-height:1.6}
  .key .v{font-size:26px}.key .u{font-size:14px}.key .l{font-size:13px}
  #fold{display:block;position:absolute;right:12px;top:8px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:13px;padding:4px 12px;color:var(--ink2)}
  #ctrl{right:10px;top:10px;gap:6px}#ctrl button{font-size:13px;padding:6px 10px}
  #hint{display:none}
  #subt{font-size:16px;bottom:10px}
  .tag b{font-size:13px}.tag s{font-size:11px}.tag{padding:3px 7px 4px 7px}
  #bar button{min-width:58px}#bar button span{font-size:12px}
}
@media (max-width:1100px) and (orientation:landscape){
  :root{--pw:clamp(260px,32vw,360px)}
  #no{font-size:64px}#ttl{font-size:30px}#desc{font-size:15px}.key .v{font-size:26px}
}
</style>

22.52,26.08,"上來以後要沿平台西緣繞到南側走道"],[26.08,29.22,"西緣夾在欄杆和化鐵釜開口中間"],[29.22,31.52,"最窄只有 61 公分"],[31.52,34.12,"沿南側走道往東走到中段"],[34.12,38.01,"兩個過濾板框開口把平台切斷，過不去"],[38.01,40.17,"只能原路回西梯下來"],[40.17,43.54,"東半邊要從地面繞過去，再上東梯"],[43.54,45.65,"東梯和西梯一樣尺寸"],[45.65,49.23,"東緣到南側走道也只有 60 公分"],[49.23,53.32,"所以化鐵平台每一塊都只有一個方向可以下來"],[53.32,57.01,"西半最遠的點要走 61 公尺才到出口"],[57.01,58.77,"東半 51 公尺"],[58.77,59.74,"要改的是"],[59.74,63.43,"中段開口加一段 90 公分的連通走道"],[63.43,66.53,"平台兩端走道加寬到 90 公分"],[66.53,69.54,"平台上方換熱器抽管束的空間"],[69.54,72.75,"到屋頂還有 4.4 公尺，夠"]],"text":"進化鐵車間，先走化鐵釜和鐵液過濾板框中間，最窄 88 公分，被平台柱腳基座吃掉一點。到西端上化鐵平台西梯：梯寬 100 公分，級高 18.8、級深 25 公分，中間在 2.25 公尺有一個梯台，一共上到 4.5 公尺。上來以後要沿平台西緣繞到南側走道，西緣夾在欄杆和化鐵釜開口中間，最窄只有 61 公分。沿南側走道往東走到中段，兩個過濾板框開口把平台切斷，過不去，只能原路回西梯下來。東半邊要從地面繞過去，再上東梯，東梯和西梯一樣尺寸；東緣到南側走道也只有 60 公分。所以化鐵平台每一塊都只有一個方向可以下來，西半最遠的點要走 61 公尺才到出口，東半 51 公尺。要改的是：中段開口加一段 90 公分的連通走道，平台兩端走道加寬到 90 公分。平台上方換熱器抽管束的空間，到屋頂還有 4.4 公尺，夠。"},{"id":"r03","no":"03","short":"合成 PF-02","title":"合成平台","sub":"生產車間北段 氧化釜、陳化釜、+4.0 m 平台、東梯 ST2／西梯 ST1","desc":"東梯上得去、北側走道寬 1.53 m；往西走到高位罐支架就被擋住。西梯從地面上得去，但安全門內有支架斜撐，離平台面只有 0.56 m，進不了平台。","keys":[["147","m","本段路線"],["39.8","°","東梯斜度（級高 20／級深 24 cm）"],["0.56","m","西梯安全門內斜撐高度（紅）"],["43.6","m","平台最遠點逃生到出口"]],"refs":[null,null,null,null],"color":"#d9622b","cam":{"c":[-18.0,3,-16.0],"R":44,"el":48,"T":3000,"az0":340,"moves":[{"c":[-7.0,2,-18.0],"R":32,"el":52,"k0":0.0615,"k1":0.1415,"gg":0,"az":95},{"c":[-21.0,4,-20.0],"R":34,"el":58,"k0":0.2868,"k1":0.3668,"gg":0,"az":175},{"c":[-22.0,1,-8.5],"R":38,"el":56,"k0":0.3978,"k1":0.4778,"gg":0,"az":0},{"c":[-34.5,3,-18.0],"R":30,"el":52,"k0":0.5682,"k1":0.6382,"gg":0,"az":265},{"c":[-20.0,3,-16.0],"R":46,"el":58,"k0":0.7153,"k1":0.7953,"gg":0,"az":350}]},"ghost":true,"ghostRect":[-42.0,-33.0,4.0,-2.0],"ghostSkip":[],"callouts":[{"p":[-6.32,5.0,-17.8],"t":"合成平台東梯 PF-02 ST2","s":"梯寬 1.00 m・級高 20／級深 24 cm・39.8°・0→+4.0","box":[0.3,0.3,0.6],"win":[0.0615,0.3268]},{"p":[-17.0,4.6,-20.4],"t":"北側走道","s":"淨寬 1.53 m・淨高 5.0 m","box":[0.3,0.3,0.6],"win":[0.2868,0.3978],"color" 四塊的走道"],[61.6,63.44,"另外補第二座樓梯"]],"text":"從合成西梯腳往南，到板框平台樓梯。樓梯梯寬 100 公分，級高 18.6、級深 25 公分，中間 2.05 公尺有梯台，上到 4.1 公尺。上到安全門就停住了：門後就是濾餅板框 F-201C，淨寬只有 6 公分，頭頂還有配管，只剩 1.1 公尺。平台上可以走的範圍有 103 平方公尺，被板框和開口切成 4 塊，沒有一塊連得到這座樓梯，在平台上出事等於沒有路下來。板框之間的操作空間倒是夠，420 型之間 1.36 到 2.44 公尺。地面繞平台北、東、南三側走一圈，寬 1.7 公尺以上，沒有問題；水壓罐的罐身爬梯是罐頂檢修用。要改的是：樓梯和安全門移到 F-201C 南側，平台上加一條連通四塊的走道，另外補第二座樓梯。"},{"id":"r05","no":"05","short":"儲罐 PF-10","title":"儲罐區架台","sub":"兩防液堤＋+7.0 m 架台、兩座折返樓梯塔 PF-10 ST1／ST2","desc":"兩座折返樓梯塔，梯寬 0.90 m、每 1.75 m 一個梯台；架台兩個方向都下得去。罐邊北緣 0.75 m 偏窄；母液泵 P-404 馬達側只有 0.11 m。","keys":[["153","m","本段路線"],["2.10","m","ST1 梯段最低淨高（剛好）"],["0.75","m","+7.0 北緣罐邊（紅）"],["0.11","m","P-404 馬達側維修空間（紅，需 0.8）"]],"refs":[null,null,null,null],"color":"#d9622b","cam":{"c":[-51.0,3,-13.0],"R":40,"el":50,"T":3000,"az0":30,"moves":[{"c":[-47.0,1,-10.5],"R":26,"el":50,"k0":0.043,"k1":0.123,"gg":0,"az":20},{"c":[-57.3,3.5,-20.5],"R":30,"el":50,"k0":0.297,"k1":0.367,"gg":0,"az":200},{"c":[-52.0,7,-15.0],"R":26,"el":58,"k0":0.5462,"k1":0.6162,"gg":0,"az":130},{"c":[-57.0,3.5,-13.0],"R":30,"el":50,"k0":0.6496,"k1":0.7296,"gg":0,"az":250}]},"ghost":true,"ghostRect":[-68.0,-28.0,-31.0,1.0],"ghostSkip":[],"callouts":[{"p":[-39.7,1.6,-10.5],"t":"P-404 馬達側","s":"0.11 m（需 0.8）","box":[0.3,0.3,0.6],"win":[0.1229,0.317],"color":"#e53935"},{"p":[-50.0,1.6,-10.5],"t":"母液泵 P-403 之間","s":"0.98～3.19 m","box":[0.3,0.3,0.6],"win":[0.1529,0.317],"color":"#19c37d"},{"p":[-57.3,8.4,-21.0],"t":"儲罐區樓梯塔 PF-10 ST1","s":"梯寬 0.90 m（扶手間 0.86）・級高 17.5／級深 25 cm・0→+7.0","box":[0.3,0.3,0.6],"win":[0.307,0.5862]},{"p":[-54.05,8.0,-19.35],"t":"+7.0 北緣罐邊","s":"最窄 0.75 m","box":[0.3,0.3,0.6],"win":[0.5562,0.6696],"color":"#e53935"},{"p":[-58.15,8.4,-13.0],"t":"儲罐區樓梯塔 PF-10 ST2","s":"梯寬 0.90 m・兩個方向都下得去","box":[0.3,0.3,0.6],"win":[0.6596,1.01],"color":"#19c37d"}],"legend":[["fill","#ffb300","巡檢路線（箭頭＝走的方向）"],["fill","#e53935","不合格：淨寬 <0.9 m（樓梯扶手間 <0.85 m）、淨高 <2.1 m、絆腳或走不過"],["fill","#19c37d","綠框＝維修空間夠"],["fill","#e53935","紅框＝維修空間不夠"],["fill","#19c37d","綠色帶＝逃生路 // ───────── 載入模型
const MATS = {};

    mesh.castShadow = !m.transparent && !D.ghostLayers.includes(L) && L !== "地面" && L !== "建物_地坪";

    scene.add(mesh);

await load();
ACT = initActors(THREE, scene, D, MATS);
window.actorDump = t => ACT.dump(t);
enter(0, null, AZ0[0]);
window.__ready = true;
window.__dbg = { THREE, scene, cam, MATS, GU };          // 檢核用

// ───────── 錄影：依時間軸逐格（與自動播放同一套鏡頭與換章規則）
window.DECK = { total: T0[N], T0, chapters: CH.map(c => ({ id: c.id, no: c.no, short: c.short, D: c.D, lead: c.lead, aid: c.aid })) };
window.renderAt = function (t, dt = 1 / 30) {
  let i = 0; while (i < N - 1 && t >= T0[i + 1]) i++;
  if (!ses || ses.i !== i) {
    const from = i > 0 ? orbitPose(i - 1, CH[i - 1].D, AZ0[i - 1]) : null;
    enter(i, from, AZ0[i]);
  }
  update(t - T0[i], dt); if (!window.renderAt.noRender) renderer.render(scene, cam);
  return i;
};
window.renderChapter = function (i, tau) {            // 試拍：從本章起點前 1.5 s 逐格跑到指定時間（標註位置的平滑才會跟錄影一樣）
  const t = T0[i] + tau; ses = null;
  for (let tt = Math.max(0, t - 1.5); tt < t - 1e-6; tt += 1 / 30) window.renderAt(tt);
  return window.renderAt(t);
};
// 檢核：逐格跑本章（只算鏡頭與標註、不出圖），抽樣檢查標註點是否在畫面內、是否被實體擋住、標籤是否互壓或壓到字幕、鏡頭上方有無構件
window.audit = function (i, ns = 10) {
  const rc = new THREE.Raycaster(); const solid = scene.children.filter(o => o.isMesh && o.material && !o.material.transparent && o !== ground && o.name !== "地面" && o.name !== "建物_地坪");
  ses = null; const st = $("stage"), W = st.clientWidth, H = st.clientHeight;
  const res = { id: CH[i].id, D: CH[i].D, samples: [], tags: CH[i].callouts.map(c => ({ t: c.t, inView: 0, visible: 0, n: 0 })), camAbove: 0, minCamY: 1e9, overlap: 0, subHit: 0 };
  const F = flyTime(i > 0 ? orbitPose(i - 1, CH[i - 1].D, AZ0[i - 1]) : orbitPose(0, 0, AZ0[0]), orbitPose(i, 0, AZ0[i]));
  const times = []; for (let k = 0; k < ns; k++) times.push(F + 1.0 + (CH[i].D - F - 1.5) * k / Math.max(1, ns - 1));
  let tt = T0[i]; const end = T0[i] + CH[i].D - 0.05;
  for (const tau of times) {
    while (tt < T0[i] + tau) { window.renderAt.noRender = true; window.renderAt(tt); tt += 1 / 30; }
    window.renderAt.noRender = true; window.renderAt(T0[i] + tau); window.renderAt.noRender = false;
    res.minCamY = Math.min(res.minCamY, cam.position.y);
    rc.set(cam.position, new THREE.Vector3(0, 1, 0)); if (rc.intersectObjects(solid, false).length) res.camAbove++;
    const boxes = [];

      const r = res.tags[k]; if (t.zone) { r.skip = "分區標籤"; return; }
      if (t.win && (tau / CH[i].D < t.win[0] + 0.03 || tau / CH[i].D > t.win[1] - 0.03)) return;
      r.n++;
      _v.copy(t.p).project(cam); const ax = (_v.x + 1) / 2 * W, ay = (1 - _v.y) / 2 * H;
      const inV = _v.z < 1 && ax > 0 && ax < W && ay > 0 && ay < H; if (inV) r.inView++;
      const [hx, hz, hh] = t.box, top = t.p.clone().add(new THREE.Vector3(0, -0.3, 0)), mid = top.clone().add(new THREE.Vector3(0, -hh / 2, 0));
      const pts = [top, mid.clone().add(new THREE.Vector3(hx, 0, 0)), mid.clone().add(new THREE.Vector3(-hx, 0, 0)), mid.clone().add(new THREE.Vector3(0, 0, hz)), mid.clone().add(new THREE.Vector3(0, 0, -hz))];
      let seen = 0;

        if (!rc.intersectObjects(solid, false).some(h => h.distance < dist - Math.max(0.6, Math.min(hx, hz)))) seen++; }
      if (inV && seen) r.visible++;

    });
    for (let a = 0; a < boxes.length; a++) for (let b = a + 1; b < boxes.length; b++) { const p = boxes[a], q = boxes[b]; if (p[0] < q[2] && p[2] > q[0] && p[1] < q[3] && p[3] > q[1]) res.overlap++; }
    const se = $("subt").getBoundingClientRect(), sr = st.getBoundingClientRect();
    if ($("subt").textContent) for (const p of boxes) if (p[0] < se.right - sr.left && p[2] > se.left - sr.left && p[1] < se.bottom - sr.top && p[3] > se.top - sr.top) res.subHit++;
  }

};
// 檢核：全片逐格鏡頭軌跡（不出圖）：每格位移、速度跳動、注視點角速度，找換章或環繞的頓點
window.motion = function (fps = 30) {
  ses = null; const out = { frames: 0, maxStep: 0, maxJerk: 0, maxTurn: 0, worst: [], perCh: [] }; let p0 = null, v0 = null, d0 = null;
  const total = T0[N]; const rows = [];
  for (let f = 0; f * (1 / fps) < total; f++) {
    const t = f / fps; window.renderAt.noRender = true; const i = window.renderAt(t, 1 / fps); window.renderAt.noRender = false;
    const p = cam.position.clone(), d = new THREE.Vector3(); cam.getWorldDirection(d);
    if (p0) { const v = p.clone().sub(p0); const step = v.length(); const turn = Math.acos(clamp(d.dot(d0), -1, 1)) / DEG;
      const jerk = v0 ? v.clone().sub(v0).length() : 0; rows.push({ t, i, step, jerk, turn });
      out.maxStep = Math.max(out.maxStep, step); out.maxJerk = Math.max(out.maxJerk, jerk); out.maxTurn = Math.max(out.maxTurn, turn); v0 = v; }
    p0 = p; d0 = d; out.frames++;
  }

  for (let i = 0; i < N; i++) { const rr = rows.filter(r => r.i === i); out.perCh.push({ id: CH[i].id, maxStep: +Math.max(...rr.map(r => r.step)).toFixed(3), maxJerk: +Math.max(...rr.map(r => r.jerk)).toFixed(3), maxTurnDeg: +Math.max(...rr.map(r => r.turn)).toFixed(2), orbitDegPerS: +(360 / CH[i].cam.T).toFixed(1) }); }
  return out;
};
window.warmTo = function (t) { ses = null; for (let tt = Math.max(0, t - 1.5); tt < t - 1e-6; tt += 1 / 30) window.renderAt(tt); };
if (REC) { window.renderAt(0); }
else {
  // ───────── 互動：拖曳旋轉、滾輪縮放、鍵盤換章、自動播放
  const stg = $("stage"); let drag = null;
  stg.addEventListener("pointerdown", e => { if (e.target.closest("#ctrl")) return; drag = { x: e.clientX, y: e.clientY }; stg.setPointerCapture(e.pointerId); });
  stg.addEventListener("pointermove", e => { if (!drag) return; user.az -= (e.clientX - drag.x) * 0.28; user.el = clamp(user.el + (e.clientY - drag.y) * 0.18, -40, 40); drag = { x: e.clientX, y: e.clientY }; });
  stg.addEventListener("pointerup", () => { drag = null; }); stg.addEventListener("pointercancel", () => { drag = null; });
  stg.addEventListener("wheel", e => { e.preventDefault(); user.zoom = clamp(user.zoom * Math.exp(e.deltaY * 0.0012), 0.35, 2.6); }, { passive: false });
  stg.addEventListener("dblclick", () => { user.az = 0; user.el = 0; user.zoom = 1; });
  const setAuto = on => { auto = on; $("bPlay").textContent = on ? "❚❚ 暫停" : "▶ 自動播放"; $("bPlay").classList.toggle("on", on); if (on) { const s0 = ses.i >= N - 1 ? 0 : ses.i; goto(s0); if (voiceOn) voiceUnlock(CH[s0].aid); } else { clearTimeout(audTimer); audio.pause(); } bgmPlay(on); };
  $("bPlay").onclick = () => setAuto(!auto);
  $("bVoice").onclick = () => { voiceOn = !voiceOn; $("bVoice").classList.toggle("on", voiceOn); if (!voiceOn) audio.pause(); };
  if (!BGM.on) $("bMusic").style.display = "none";
  $("bMusic").onclick = () => { const v = !$("bMusic").classList.contains("on"); $("bMusic").classList.toggle("on", v); if (v) { BGM.on = true; if (auto) bgmPlay(true); } else { bgmPlay(false); BGM.on = false; BGM.el.pause(); } };
  $("bSub").onclick = () => { subOn = !subOn; $("bSub").classList.toggle("on", subOn); };

  $("fold").onclick = () => { const f = !$("panel").classList.contains("folded"); $("panel").classList.toggle("folded", f); $("fold").textContent = f ? "展開 ▴" : "收合 ▾"; $("fold").setAttribute("aria-expanded", String(!f)); setTimeout(resize, 320); };
  addEventListener("keydown", e => {

    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goto(ses.i - 1); }

  });
  new ResizeObserver(resize).observe($("stage"));
  let last = performance.now();
  (function loop() {
    requestAnimationFrame(loop);
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (window.__pause) return;
    const tau = (now - ses.t0) / 1000;
    if (auto && tau >= CH[ses.i].D) { if (ses.i < N - 1) goto(ses.i + 1); else setAuto(false); }
    update((performance.now() - ses.t0) / 1000, dt); renderer.render(scene, cam);
  })();
}
