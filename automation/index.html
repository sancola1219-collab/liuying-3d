<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台南廠 自動化系統導覽</title>
<style>
:root{
  --bg:#f3f4f2; --panel:#fbfbf9; --ink:#1c2430; --ink2:#5a6472; --ink3:#8a929c; --line:#dfe2e0;
  --acc:#d9622b; --acc2:#f6e3d8;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
  --pw:clamp(360px,30vw,560px); --bh:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--pw) 1fr;grid-template-rows:1fr var(--bh);grid-template-areas:"panel stage" "bar bar"}
#panel{grid-area:panel;background:var(--panel);border-right:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
#brand{display:flex;justify-content:space-between;align-items:center;padding:22px 34px 0;font-size:14px;letter-spacing:.18em;color:var(--ink3)}
#brand b{color:var(--ink);font-weight:700;letter-spacing:.12em}
#pin{flex:1;overflow:auto;padding:10px 34px 24px;scrollbar-width:thin}
#no{font-size:118px;line-height:1;font-weight:200;color:var(--acc);letter-spacing:-.02em;margin-top:18px;font-variant-numeric:tabular-nums}
#no small{font-size:20px;color:var(--ink3);font-weight:400;letter-spacing:.1em;margin-left:10px;vertical-align:top;position:relative;top:16px}
#ttl{font-size:46px;font-weight:800;margin:8px 0 4px;line-height:1.15;letter-spacing:.02em}
#sub{font-size:18px;color:var(--ink2);margin:0 0 18px;padding-left:12px;border-left:4px solid var(--acc)}
#desc{font-size:19px;line-height:1.75;color:#333b46;margin:0 0 20px}
#keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 22px;margin-bottom:18px}
.key{border-top:1px solid var(--line);padding:12px 0 8px}
.key .v{font-size:38px;font-weight:800;color:var(--acc);line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.key .u{font-size:17px;font-weight:600;color:var(--ink2);margin-left:5px}
.key .l{font-size:15px;color:var(--ink2);margin-top:4px;line-height:1.35}
#legend{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--ink2)}
#legend span{display:inline-flex;align-items:center;gap:7px}
#legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
#legend i.dot{border-radius:50%;width:12px;height:12px;border:2px solid #fff;box-shadow:0 0 0 1.5px currentColor}
#legend i.flow{width:16px;height:12px;border-radius:0;clip-path:polygon(0 25%,60% 25%,60% 0,100% 50%,60% 100%,60% 75%,0 75%)}
#legend i.role{width:12px;height:16px;border-radius:6px 6px 3px 3px;border-top:5px solid #fff}
#legend i.ghost{background:repeating-linear-gradient(45deg,#c9ced3 0 3px,transparent 3px 6px);border:1px solid #b9bfc5}
#fold{display:none}
#keys.k3{grid-template-columns:repeat(3,1fr)}
#io{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
#io span{display:inline-flex;align-items:baseline;gap:5px;border-radius:5px;padding:5px 9px;font-size:14px;color:#26303c;background:color-mix(in srgb,var(--k) 16%,#fff);border:1px solid color-mix(in srgb,var(--k) 45%,#fff)}
#io span b{font-size:20px;font-weight:800;color:var(--k);font-variant-numeric:tabular-nums}
#io span.z{opacity:.45}
#design{margin:0 0 16px;padding:0;list-style:none}
#design li{position:relative;padding:4px 0 4px 18px;font-size:16px;line-height:1.45;color:#2b3440}
#design li:before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border-radius:2px;background:var(--acc)}
#dtitle{font-size:13px;letter-spacing:.14em;color:var(--ink3);margin:2px 0 4px}
#legend i.box{border-radius:2px;width:12px;height:16px}
#page{position:absolute;inset:0;background:#f3f4f2;opacity:0;display:none;container-type:size;overflow:hidden}
#page .pg{position:absolute;inset:0;padding:3.2cqh 3cqw 13cqh;font-size:min(1.45cqw,2.3cqh);color:#1c2430}
#page svg.pl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
#page [data-a]{opacity:0}
.chip{display:inline-block;border:1px solid #cfd6de;background:#fff;border-radius:4px;padding:.15em .5em;margin:.12em .25em .12em 0;font-size:.92em;white-space:nowrap}
.arch{display:grid;grid-template-columns:1fr 16em;gap:1.4em;height:100%}
.lyrs{display:flex;flex-direction:column;gap:.7em;height:100%}
.lyr{flex:1;display:grid;grid-template-columns:7.2em 1fr 13em;align-items:center;gap:1em;background:#fff;border:1px solid #dfe3e6;border-left:.45em solid var(--c);border-radius:.4em;padding:.4em 1em;position:relative;z-index:4}
.lyr .lv{font-size:2em;color:var(--c);line-height:1}.lyr .lv small{display:block;font-size:.42em;color:#5a6472;margin-top:.25em;letter-spacing:.1em}
.lyr .lt{font-size:1.25em;font-weight:800;margin-bottom:.2em}
.lyr .ln{font-size:1.02em;color:#334;font-weight:700;text-align:right}
.zones{display:flex;flex-direction:column;gap:.5em;height:100%}
.zn{border-radius:.4em;padding:.6em .8em;color:#fff}.zn b{display:block;font-size:1.4em}.zn span{font-size:.92em;opacity:.92}
.zit{background:#6a3fb5;flex:1}.zdmz{background:#2563c9;flex:1}.zot{background:#13897d;flex:3}
.zbar{background:#c62828;color:#fff;font-weight:700;text-align:center;padding:.55em .4em;border-radius:.3em;font-size:.95em}
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:1.6em;height:100%}.two .col{min-width:0}
.tb{width:100%;border-collapse:collapse;background:#fff;font-size:1em}
.tb th,.tb td{border-bottom:1px solid #e3e6e9;padding:.42em .55em;text-align:left;vertical-align:middle}
.tb thead th{background:#0f4c81;color:#fff;font-weight:700;font-size:.95em}
.tb tbody th{font-weight:700;white-space:nowrap}
.tb .pd{font-weight:700;color:#0f4c81}.tb .qi{color:#5a6472;text-align:center}
.tb.io td{text-align:center;font-variant-numeric:tabular-nums}.tb.io td.bold{font-weight:800}.tb.io td.com{color:#0d8a86;font-size:.9em;white-space:nowrap}
.tb.io i{color:#b4bac1;font-style:normal}.tb.io tr.tot{background:#eef3f8}.tb.io tr.tot th,.tb.io tr.tot td{font-weight:800;border-top:2px solid #0f4c81}
.tb.io th,.tb.io td{padding:.24em .5em}
.cards{display:flex;flex-direction:column;gap:.7em}
.card{flex:1;background:#fff;border:1px solid #dfe3e6;border-radius:.5em;padding:.6em .9em .6em 3.2em;position:relative}
.card em{position:absolute;left:.6em;top:.45em;font-style:normal;font-size:1.9em;font-weight:200;color:#0f4c81}
.card b{display:block;font-size:1.25em;margin-bottom:.2em}.card p{margin:0;color:#3b4552;line-height:1.45}
.side{display:flex;flex-direction:column;gap:.8em}
.kpi{background:#fff;border:1px solid #dfe3e6;border-radius:.5em;padding:.7em 1em}
.kpi>b{font-size:2.4em;font-weight:800;color:#0f4c81;margin-right:.3em;font-variant-numeric:tabular-nums}.kpi small{display:block;color:#5a6472;letter-spacing:.06em}
.kpi.big>b{font-size:3em}.kpi.ex span{line-height:1.5}
.stk{display:flex;height:3.1em;border-radius:.3em;overflow:hidden;margin-bottom:.35em}.stk span{color:#fff;font-weight:700;font-size:.85em;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden}
.net{display:flex;flex-direction:column;gap:.55em;height:100%}
.zone{position:relative;display:flex;gap:.8em;align-items:stretch;border:2px dashed;border-radius:.6em;padding:.55em .8em .55em 5.2em}
.zone>i{position:absolute;left:.7em;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;font-size:1.25em}
.zone.it{border-color:#6a3fb5}.zone.it>i{color:#6a3fb5}.zone.dmz{border-color:#2563c9}.zone.dmz>i{color:#2563c9}.zone.ot{border-color:#13897d;flex:1;flex-direction:column}.zone.ot>i{color:#13897d}
.nd{flex:1;background:#fff;border:1px solid #cfd6de;border-radius:.4em;padding:.4em .6em;position:relative;z-index:4}.nd b{display:block;font-size:1.05em}.nd span{font-size:.86em;color:#5a6472}
.nd.core{background:#0f6fd6;border-color:#0f6fd6;color:#fff;flex:0 0 auto;align-self:center;padding:.5em 2em;text-align:center}.nd.core span{color:#dbe8ff}
.nd.jump{border-color:#c62828}.ring{display:flex;gap:.6em}.nd.sw{border-color:#13897d}.nd.fld{flex:0 0 auto;background:#eef7f5}
.fw{align-self:center;background:#c62828;color:#fff;font-weight:700;padding:.35em 1.6em;border-radius:.3em;position:relative;z-index:4}
.note{color:#0f4c81;font-weight:700;margin-top:.3em}
.gantt{display:flex;flex-direction:column;height:100%;padding-left:12.5em;position:relative}
.gh{position:relative;height:1.6em;border-bottom:1px solid #c9d0d7}.gh span{position:absolute;bottom:.2em;font-size:.85em;color:#5a6472;transform:translateX(-10%)}
.gb{position:relative;flex:1;display:flex;flex-direction:column;justify-content:space-around}
.gr{position:relative;height:2.6em}.gr>b{position:absolute;left:-12.5em;width:12em;top:.5em;font-size:1.02em}
.gt{position:absolute;inset:0}.gt i{position:absolute;top:.25em;height:1.2em;background:#0f6fd6;border-radius:.3em}.gt span{position:absolute;top:1.55em;font-size:.84em;color:#3b4552;white-space:nowrap}
.gm{position:absolute;inset:0;pointer-events:none}.ms{position:absolute;top:0;bottom:0;border-left:2px dashed #c62828}.ms span{position:absolute;top:-.1em;left:.3em;background:#c62828;color:#fff;font-size:.8em;padding:.1em .4em;border-radius:.2em;white-space:nowrap}
.bg{display:grid;grid-template-columns:12em 1fr;align-items:center;gap:.6em;height:calc((100% - 1em)/14)}
.bg b{font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bt{position:relative;height:70%}.bt i{position:absolute;left:0;top:0;bottom:0;background:#0f6fd6;border-radius:.2em}.bt span{position:absolute;right:.4em;top:50%;transform:translateY(-50%);font-weight:700;font-variant-numeric:tabular-nums}
@container (aspect-ratio < 1){
  #page .pg{font-size:min(2.55cqw,1.7cqh);padding:62px 2.5cqw 11cqh}   /* 手機：上方留給按鈕列，不壓架構圖 */
  .arch{grid-template-columns:1fr;grid-template-rows:1fr auto}.zones{flex-direction:row;height:auto}.zn,.zbar{flex:1}.zot{flex:1.4}
  .lyr{grid-template-columns:5.2em 1fr;padding:.3em .6em}.lyr .ln{grid-column:1/-1;text-align:left;font-size:.92em}
  .two{grid-template-columns:1fr;grid-template-rows:auto auto;gap:.8em}.cards{display:grid;grid-template-columns:1fr 1fr;gap:.5em}.card p{font-size:.9em}
  .tb.sm td:nth-child(3){display:none}.tb.sm th:nth-child(3){display:none}
  .io2 .side{display:grid;grid-template-columns:1fr 1fr;gap:.5em}.kpi>b{font-size:1.7em}
  .zone{padding-left:.6em;padding-top:1.6em;flex-wrap:wrap}.zone>i{top:.2em;transform:none}.ring{flex-wrap:wrap}.ring .nd{flex:1 1 30%}
  .gantt{padding-left:0}.gr{height:3.2em}.gr>b{position:static;display:block;width:auto;font-size:.95em}.gt{top:1.3em}
  .bud .side{display:grid;grid-template-columns:1fr 1fr;gap:.5em}.bg{grid-template-columns:9em 1fr;height:2.1em}.kpi.big>b{font-size:1.8em}
}
#stage{grid-area:stage;position:relative;overflow:hidden;background:linear-gradient(#e9eef2,#f3f4f1);touch-action:none}
#gl{position:absolute;inset:0}
#gl canvas{display:block;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;background:rgba(255,255,255,.95);border:1px solid rgba(28,36,48,.14);border-left:4px solid var(--c,#d9622b);border-radius:3px;padding:5px 10px 6px 9px;white-space:nowrap;box-shadow:0 2px 8px rgba(20,30,40,.10);will-change:transform,opacity}
.tag b{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.25}
.tag s{display:block;text-decoration:none;font-size:14px;color:var(--ink2);line-height:1.25}
.tag.zone{border-left-width:0;border-radius:14px;padding:4px 12px;background:var(--c);border-color:transparent;color:#fff}
.tag.zone b{color:#fff;font-size:15px}
#subt{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:86%;text-align:center;font-size:29px;line-height:1.45;color:#fff;background:rgba(24,30,38,.74);padding:8px 22px 10px;border-radius:6px;opacity:0;pointer-events:none;letter-spacing:.03em}
#ctrl{position:absolute;right:18px;top:16px;display:flex;gap:8px;align-items:center}
#ctrl button{border:1px solid rgba(28,36,48,.16);background:rgba(255,255,255,.92);color:var(--ink);font-size:15px;padding:8px 14px;border-radius:20px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
#ctrl button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#hint{position:absolute;right:16px;bottom:12px;font-size:13px;color:var(--ink2);pointer-events:none;background:rgba(255,255,255,.82);padding:4px 10px;border-radius:12px}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2);background:rgba(243,244,242,.9)}
#bar{grid-area:bar;display:flex;align-items:stretch;background:#fff;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#bar::-webkit-scrollbar{display:none}
#bar button{flex:1 0 auto;min-width:64px;border:0;border-right:1px solid #eef0ee;background:none;padding:8px 8px 10px;text-align:left;position:relative;color:var(--ink3)}
#bar button em{display:block;font-style:normal;font-size:13px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums}
#bar button span{display:block;font-size:14px;white-space:nowrap;margin-top:2px}
#bar button.on{color:var(--ink);background:#f6f7f5}
#bar button.on em{color:var(--c,#d9622b)}
#bar button i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--c,#d9622b)}
#bar button.done i{width:100%;opacity:.25}
body.rec #ctrl,body.rec #hint{display:none}
/* 手機直式：模型在上、資訊欄在下可收合 */
@media (max-width:820px) and (orientation:portrait){
  :root{--bh:58px}
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto var(--bh);grid-template-areas:"stage" "panel" "bar"}
  #panel{border-right:0;border-top:1px solid var(--line);max-height:46vh;transition:max-height .3s}
  #panel.folded{max-height:92px}
  /* 10/10 手機實看修正：模型區放大、標籤縮小、引線縮短、右上角不壓字 */
  #panel{max-height:34vh}#panel.folded{max-height:76px}
  #brand2{display:none}
  #no{font-size:36px}#ttl{font-size:22px}#desc{font-size:14px;line-height:1.55}
  .tag{padding:2px 6px 3px 6px;border-left-width:3px}.tag b{font-size:11px}.tag s{font-size:9.5px}
  .tag.zone{padding:2px 8px}.tag.zone b{font-size:11px}
  #ctrl{right:8px;top:8px;gap:5px}#ctrl button{font-size:12px;padding:5px 9px}
  #subt{font-size:14px;max-width:94%;padding:5px 12px 6px;bottom:8px}
  #brand{padding:10px 16px 0;font-size:12px}
  #pin{padding:4px 16px 14px}
  #no{font-size:44px;margin-top:2px;display:inline-block}
  #no small{font-size:13px;top:4px}
  #ttl{font-size:26px;display:inline-block;margin:0 0 0 10px;vertical-align:6px}
  #sub{font-size:14px;margin:6px 0 10px}
  #desc{font-size:15px;line-height:1.6}
  .key .v{font-size:26px}.key .u{font-size:14px}.key .l{font-size:13px}
  #fold{display:block;position:absolute;right:12px;top:8px;border:1px solid var(--line);background:#fff;border-radius:14px;font-size:13px;padding:4px 12px;color:var(--ink2)}
  #ctrl{right:10px;top:10px;gap:6px}#ctrl button{font-size:13px;padding:6px 10px}
  #hint{display:none}
  #subt{font-size:16px;bottom:10px}
  .tag b{font-size:13px}.tag s{font-size:11px}.tag{padding:3px 7px 4px 7px}
  #bar button{min-width:58px}#bar button span{font-size:12px}
  body.pgch #panel{max-height:118px}
}
@media (max-width:1100px) and (orientation:landscape){
  :root{--pw:clamp(260px,32vw,360px)}
  #no{font-size:64px}#ttl{font-size:30px}#desc{font-size:15px}.key .v{font-size:26px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="inapp" style="display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:#b45309;color:#fff;padding:8px 12px;font-size:14px;text-align:center">LINE／FB 內建瀏覽器可能開不動 3D，請點右上角「…」→「用預設瀏覽器開啟」（Chrome／Safari）</div>
<script>if (/Line\/|FBAN|FBAV|Instagram/i.test(navigator.userAgent)) document.getElementById("inapp").style.display = "block";</script>

<div id="app">
  <aside id="panel">
    <div id="brand"><b>台南廠</b><span id="brand2">自動化系統規劃與設計</span></div>
    <button id="fold" aria-expanded="true">收合 ▾</button>
    <div id="pin">
      <div id="no">00</div>
      <h1 id="ttl"></h1>
      <p id="sub"></p>
      <p id="desc"></p>
      <div id="keys"></div>
      <div id="io"></div>
      <div id="dtitle"></div>
      <ul id="design"></ul>
      <div id="legend"></div>
    </div>
  </aside>
  <main id="stage">
    <div id="gl"></div>
    <div id="page"></div>
    <svg id="lines"></svg>
    <div id="tags"></div>
    <div id="subt"></div>
    <div id="ctrl">
      <button id="bPlay">▶ 自動播放</button>
      <button id="bVoice" class="on">旁白</button>
      <button id="bMusic" class="on">音樂</button>
      <button id="bSub" class="on">字幕</button>
      <button id="bVideo">看影片</button>
      <button id="bFull">全螢幕</button>
    </div>
    <div id="hint">← → 或空白鍵換章　拖曳旋轉　滾輪縮放</div>
    <div id="load">載入模型中…</div>
  </main>

  $("bVideo").onclick = () => { if (auto) setAuto(false); window.open(D.video, "_blank"); };
  $("bFull").onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
  $("fold").onclick = () => { const f = !$("panel").classList.contains("folded"); $("panel").classList.toggle("folded", f); $("fold").textContent = f ? "展開 ▴" : "收合 ▾"; $("fold").setAttribute("aria-expanded", String(!f)); setTimeout(resize, 320); };
  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); goto(ses.i + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); goto(ses.i - 1); }
    else if (e.key === "Home") goto(0); else if (e.key === "End") goto(N - 1);
    else if (e.key === "p" || e.key === "P") setAuto(!auto);
    else if (e.key === "f" || e.key === "F") $("bFull").onclick();
  });
  new ResizeObserver(resize).observe($("stage"));
  let last = performance.now();
  (function loop() {
    requestAnimationFrame(loop);
    const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (window.__pause) return;
    const tau = (now - ses.t0) / 1000;
    if (auto && tau >= CH[ses.i].D) { if (ses.i < N - 1) goto(ses.i + 1); else setAuto(false); }
    update((performance.now() - ses.t0) / 1000, dt); renderer.render(scene, cam);
  })();
}
</script>
</body>
